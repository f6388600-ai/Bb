<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVibe - Premium Live IPTV</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HLS.js for IPTV Playback -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0f172a] text-white min-h-screen font-sans antialiased selection:bg-cyan-500 selection:text-white">

    <!-- Header / Navbar -->
    <header class="bg-[#1e293b]/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-tr from-cyan-500 to-blue-600 p-2.5 rounded-xl shadow-lg shadow-cyan-500/30">
                <i class="fa-solid fa-tv text-xl text-white"></i>
            </div>
            <span class="text-xl font-extrabold tracking-wider bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">StreamVibe</span>
        </div>
        <!-- Search Bar -->
        <div class="relative w-64 md:w-80">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                <i class="fa-solid fa-magnifying-glass"></i>
            </span>
            <input type="text" id="searchInput" onkeyup="filterChannels()" placeholder="চ্যানেল খুঁজুন..." 
                class="w-full bg-slate-900/80 text-sm text-slate-200 placeholder-slate-400 pl-10 pr-4 py-2.5 rounded-xl border border-slate-700/60 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all">
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- Left Column: Video Player & Current Info -->
        <div class="lg:col-span-2 flex flex-col space-y-4">
            <!-- Video Player Box -->
            <div class="relative aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-slate-800 group">
                <video id="videoPlayer" controls autoplay class="w-full h-full object-contain"></video>
                <div id="loadingOverlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center space-y-2 hidden">
                    <div class="w-10 h-10 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin"></div>
                    <p class="text-sm font-medium text-slate-300">চ্যানেল লোড হচ্ছে...</p>
                </div>
            </div>

            <!-- Current Playing Channel Details -->
            <div class="bg-slate-900/60 backdrop-blur-sm border border-slate-800 p-5 rounded-2xl flex items-center justify-between shadow-lg">
                <div class="flex items-center space-x-4">
                    <img id="currentLogo" src="https://i.ibb.co/3s65668/placeholder.png" alt="Logo" class="w-12 h-12 rounded-xl object-cover bg-slate-800 p-1 border border-slate-700">
                    <div>
                        <h2 id="currentTitle" class="text-lg font-bold text-slate-100">চ্যানেল সিলেক্ট করুন</h2>
                        <p id="currentCategory" class="text-xs text-cyan-400 font-medium">Live Stream</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="toggleFullscreen()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white p-3 rounded-xl transition border border-slate-700/50">
                        <i class="fa-solid fa-expand"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Column: Channel List / Grid -->
        <div class="bg-slate-900/40 backdrop-blur-sm border border-slate-800 rounded-2xl p-4 flex flex-col h-[650px] shadow-lg">
            <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
                <h3 class="font-bold text-slate-200 text-sm tracking-wide flex items-center space-x-2">
                    <i class="fa-solid fa-list-ul text-cyan-500"></i>
                    <span>চ্যানেল তালিকা</span>
                </h3>
                <span id="channelCount" class="text-xs bg-slate-800 px-2.5 py-1 rounded-full text-slate-400 border border-slate-700/50">0টি চ্যানেল</span>
            </div>

            <!-- Channel List Container -->
            <div id="channelList" class="flex-1 overflow-y-auto space-y-4 pr-1 custom-scrollbar">
                <!-- Dynamic Categories and Cards will be loaded here -->
            </div>
        </div>

    </main>

    <!-- Script Logic -->
    <script>
        let hls;
        let allCategories = [];
        const video = document.getElementById('videoPlayer');
        const channelList = document.getElementById('channelList');
        const loadingOverlay = document.getElementById('loadingOverlay');

        async function loadChannels() {
            try {
                const response = await fetch('./data/channels.json');
                const data = await response.json();
                allCategories = data.categories;
                renderChannels(allCategories);

                // প্লেয়ারে প্রথম চ্যানেলটি লোড করা
                if (allCategories.length > 0 && allCategories[0].channels.length > 0) {
                    let firstCh = allCategories[0].channels[0];
                    playChannel(firstCh.url, firstCh.name, firstCh.logo, allCategories[0].name);
                }
            } catch (error) {
                console.error('Error loading channels:', error);
                channelList.innerHTML = '<p class="text-center text-red-400 text-sm py-10">চ্যানেল ডেটা লোড করতে ব্যর্থ হয়েছে!</p>';
            }
        }

        function renderChannels(categories) {
            channelList.innerHTML = '';
            let totalChannels = 0;

            categories.forEach(cat => {
                if (cat.channels.length === 0) return;

                let catDiv = document.createElement('div');
                catDiv.className = 'category-group';
                
                let catTitle = document.createElement('h4');
                catTitle.className = 'text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 px-1';
                catTitle.textContent = cat.name;
                catDiv.appendChild(catTitle);

                let grid = document.createElement('div');
                grid.className = 'grid grid-cols-1 gap-2';

                cat.channels.forEach(ch => {
                    totalChannels++;
                    let card = document.createElement('div');
                    card.className = 'channel-card flex items-center justify-between p-2.5 rounded-xl bg-slate-800/40 hover:bg-slate-800 border border-slate-700/40 hover:border-cyan-500/50 transition-all cursor-pointer group';
                    card.onclick = () => playChannel(ch.url, ch.name, ch.logo, cat.name);

                    card.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <img src="${ch.logo}" alt="${ch.name}" class="w-10 h-10 rounded-lg object-cover bg-slate-900 border border-slate-700" onerror="this.src='https://i.ibb.co/3s65668/placeholder.png'">
                            <span class="text-sm font-medium text-slate-200 group-hover:text-cyan-400 transition-colors">${ch.name}</span>
                        </div>
                        <span class="w-8 h-8 rounded-lg bg-slate-900/60 flex items-center justify-center text-slate-400 group-hover:bg-cyan-500 group-hover:text-white transition-all">
                            <i class="fa-solid fa-play text-xs"></i>
                        </span>
                    `;
                    grid.appendChild(card);
                });

                catDiv.appendChild(grid);
                channelList.appendChild(catDiv);
            });

            document.getElementById('channelCount').textContent = `${totalChannels}টি চ্যানেল`;
        }

        function filterChannels() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let filteredCategories = allCategories.map(cat => {
                let filteredChannels = cat.channels.filter(ch => ch.name.toLowerCase().includes(query));
                return { ...cat, channels: filteredChannels };
            }).filter(cat => cat.channels.length > 0);

            renderChannels(filteredCategories);
        }

        function playChannel(url, name, logo, categoryName) {
            document.getElementById('currentTitle').textContent = name;
            document.getElementById('currentCategory').textContent = categoryName;
            document.getElementById('currentLogo').src = logo;

            loadingOverlay.classList.remove('hidden');

            let proxiedUrl = `/api/proxy?url=${encodeURIComponent(url)}`;

            if (hls) {
                hls.destroy();
            }

            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(proxiedUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                    loadingOverlay.classList.add('hidden');
                });
                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        loadingOverlay.classList.add('hidden');
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = proxiedUrl;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                    loadingOverlay.classList.add('hidden');
                });
            }
        }

        function toggleFullscreen() {
            if (video.requestFullscreen) {
                video.requestFullscreen();
            } else if (video.webkitRequestFullscreen) {
                video.webkitRequestFullscreen();
            }
        }

        window.onload = loadChannels;
    </script>
</body>
  </html>
