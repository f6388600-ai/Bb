<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HASU TV Player</title>
<style>
body{margin:0;background:#050608;color:#fff;font:14px Arial}header{padding:14px 5%;border-bottom:1px solid #252832;display:flex;justify-content:space-between;align-items:center;background:#08090d}a{color:#fff;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:22px 5%}.screen{background:#000;border:1px solid #252832;border-radius:20px;overflow:hidden;box-shadow:0 20px 80px #000}.screen video{display:block;width:100%;aspect-ratio:16/9;background:#000}.bar{padding:14px 0;display:flex;justify-content:space-between;gap:15px}.muted{color:#9ca3af}.badge{border:1px solid #30343e;padding:7px 10px;border-radius:999px}.err{color:#ff9c9c;margin-top:10px;white-space:pre-wrap}
</style></head><body><header><b>HASU•TV</b><a href="index.html">← Home</a></header><main class="wrap"><div class="screen"><video id="video" controls playsinline autoplay></video></div><div class="bar"><div><h2 id="name">Loading…</h2><div id="meta" class="muted"></div></div><span id="mode" class="badge">Starting</span></div><div id="err" class="err"></div></main>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17"></script><script>
const id=decodeURIComponent(new URLSearchParams(location.search).get("id")||""),v=document.getElementById("video"),mode=document.getElementById("mode"),err=document.getElementById("err");
let hls,usedProxy=false;
function setMode(x){mode.textContent=x}
function proxy(u){return "/api/proxy?url="+encodeURIComponent(u)}
async function start(url,viaProxy=false){usedProxy=viaProxy;setMode(viaProxy?"Proxy • Fast fallback":"Direct • Trying");if(hls){hls.destroy();hls=null}
 if(viaProxy){return startHls(proxy(url),true)}
 if(v.canPlayType("application/vnd.apple.mpegurl")){v.src=url;v.play().catch(()=>{});return}
 return startHls(url,false)}
function startHls(url,proxyMode){if(!window.Hls||!Hls.isSupported()){if(proxyMode){v.src=url;v.play().catch(()=>{})}else start(getStream(),true);return}
hls=new Hls({enableWorker:true,lowLatencyMode:true,liveSyncDurationCount:3,liveMaxLatencyDurationCount:10,maxBufferLength:12,maxMaxBufferLength:30,backBufferLength:10,capLevelOnFPSDrop:true,startLevel:-1});
hls.loadSource(url);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,()=>{setMode(proxyMode?"Proxy • Playing":"Direct • Playing");v.play().catch(()=>{})});
hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal){if(!proxyMode){start(getStream(),true)}else{setMode("Playback error");err.textContent="Stream/proxy playback failed. Check the stream URL or playlist.";}}})}
let current;
async function getStream(){return current.stream}
(async()=>{try{let list=await fetch("channels.json").then(r=>r.json());current=list.find(x=>x.id===id);if(!current){let saved=JSON.parse(localStorage.getItem("hasuPlaylist")||"[]");current=saved.find(x=>x.id===id)}if(!current)throw Error("Channel not found");document.getElementById("name").textContent=current.name;document.getElementById("meta").textContent=(current.category||"Live TV")+" • "+(current.language||"Live");await start(current.stream,false)}catch(e){setMode("Error");err.textContent=e.message}})();
</script></body></html>
