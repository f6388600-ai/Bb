<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hasu TV Player</title><style>body{margin:0;background:#08090d;color:white;font:16px system-ui;padding:16px}.box{max-width:1000px;margin:auto;background:#11131a;border:1px solid #292b35;border-radius:18px;padding:14px}video{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px}button,a{color:white;background:#252733;border:0;border-radius:9px;padding:10px 14px;text-decoration:none}#status{color:#aaa;font-size:13px}</style></head><body><div class="box"><a href="./">← Home</a><h2 id="title">Loading...</h2><video id="v" controls playsinline></video><p id="status">Loading stream...</p></div><script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script><script>let hls=null,proxyTried=false;const $=x=>document.getElementById(x);async function init(){const id=new URLSearchParams(location.search).get('id');const a=await(await fetch('./channels.json')).json();const c=a.find(x=>x.id===id)||a[0];$('title').textContent=c.name;play(c.stream,false)}function play(url,useProxy){if(hls){hls.destroy();hls=null}const v=$('v');v.pause();v.removeAttribute('src');v.load();const src=useProxy?'/api/proxy?url='+encodeURIComponent(url):url;$('status').textContent=useProxy?'Trying Vercel proxy...':'Trying direct stream...';if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=src;v.play().catch(()=>{});return}if(!window.Hls||!Hls.isSupported()){$('status').textContent='HLS not supported in this browser';return}hls=new Hls({enableWorker:true,lowLatencyMode:true,maxBufferLength:8});hls.loadSource(src);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,()=>{$('status').textContent=useProxy?'Proxy manifest loaded':'Direct manifest loaded';v.play().catch(()=>{})});hls.on(Hls.Events.ERROR,(_e,d)=>{if(d.fatal&&!useProxy&&!proxyTried){proxyTried=true;play(url,true)}else if(d.fatal)$('status').textContent='Playback failed. Check stream URL, server availability, and Vercel function logs.'})}init();</script></body></html>
