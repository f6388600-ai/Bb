<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hasu TV</title><style>body{margin:0;background:#08090d;color:#fff;font:16px system-ui;padding:20px}.card{display:inline-block;width:230px;margin:10px;background:#11131a;border:1px solid #292b35;border-radius:16px;overflow:hidden;color:white;text-decoration:none}.card img{width:100%;height:130px;object-fit:contain;background:#050609}.card div{padding:14px}.muted{color:#999}</style></head><body><h1>HASU TV <span class="muted">LIVE</span></h1><p class="muted">Choose a channel</p><main id="app"></main><script>fetch('./channels.json').then(r=>r.json()).then(a=>{document.querySelector('#app').innerHTML=a.map(c=>`<a class="card" href="play.html?id=${encodeURIComponent(c.id)}"><img src="${c.logo}"><div><b>${c.name}</b><p class="muted">${c.country} · ${c.category}</p></div></a>`).join('')})</script></body></html>
