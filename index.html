<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hasu TV</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07080b;color:#fff;font-family:system-ui,Arial}.wrap{max-width:1250px;margin:auto;padding:16px}.nav{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#101117;border:1px solid #292b34;border-radius:25px}.brand{font-weight:900;font-size:20px}.live{color:#ff2450;font-weight:800}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff1642}.count{margin-left:auto;color:#aaa}.hero{margin:22px 0;padding:32px;border-radius:25px;border:1px solid #292b34;background:radial-gradient(circle at 85%,#421020,#0d0f14 55%)}h1{font-size:clamp(38px,6vw,65px);margin:0 0 10px;letter-spacing:-3px}.hero p{color:#999;max-width:650px}.search{margin-top:22px;width:100%;padding:15px;border-radius:14px;border:1px solid #30323b;background:#08090d;color:white;outline:0}.section{margin-top:28px}.section h2{font-size:22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#0e0f15;border:1px solid #262832;border-radius:18px;overflow:hidden;cursor:pointer}.card:hover{border-color:#ff2148;transform:translateY(-2px)}.pic{height:145px;background:#08090d;position:relative;display:grid;place-items:center}.pic img{width:100%;height:100%;object-fit:contain;padding:20px}.badge{position:absolute;top:10px;left:10px;background:#ff1642;padding:5px 8px;border-radius:7px;font-size:10px;font-weight:900}.info{padding:13px}.name{font-weight:800}.meta{color:#858793;font-size:12px;margin-top:5px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{display:flex;overflow:auto}.card{min-width:225px}}
</style></head><body><div class="wrap"><header class="nav"><div class="brand">HASU TV</div><div class="live"><span class="dot"></span> LIVE</div><div class="count"><b id="count">0</b> Channels</div></header>
<section class="hero"><h1>Live TV.</h1><p>Choose a channel and open it in the dedicated player page.</p><input class="search" id="search" placeholder="Search channels..."></section><main id="app"></main></div>
<script>
let data=[];
const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function init(){data=await (await fetch("./channels.json")).json();document.querySelector("#count").textContent=data.length;render()}
function render(){let q=document.querySelector("#search").value.toLowerCase();let list=data.filter(x=>(x.name+" "+x.category+" "+x.country+" "+x.language).toLowerCase().includes(q));let groups={};list.forEach(x=>(groups[x.category]??=[]).push(x));document.querySelector("#app").innerHTML=Object.entries(groups).map(([cat,arr])=>`<section class="section"><h2>${esc(cat)}</h2><div class="grid">${arr.map(x=>`<article class="card" onclick="location.href='play.html?id=${encodeURIComponent(x.id)}'"><div class="pic"><span class="badge">LIVE</span><img src="${esc(x.logo)}"></div><div class="info"><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.country)} · ${esc(x.quality)}</div></div></article>`).join("")}</div></section>`).join("")}
document.querySelector("#search").oninput=render;init();
</script></body></html>
