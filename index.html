<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hasu TV — Live IPTV</title><meta name="theme-color" content="#07080b">
<style>
:root{--bg:#07080b;--panel:#0d0f15;--line:#252832;--muted:#90939f;--red:#ff1642}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 80% -10%,#251019 0,#07080b 35%);color:#f7f7f9;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input{font:inherit}.shell{max-width:1320px;margin:auto;padding:16px 18px 60px}
.nav{height:66px;display:flex;align-items:center;gap:14px;padding:9px 12px;border:1px solid #25262d;background:#0b0c10dd;backdrop-filter:blur(18px);border-radius:34px;position:sticky;top:10px;z-index:10}
.logo{width:46px;height:46px;border-radius:14px;object-fit:cover;background:#15161c}.brand{font-weight:900;font-size:18px}.brand small{display:block;color:#737681;font-size:10px;font-weight:600;margin-top:1px}.navlive{display:flex;align-items:center;gap:7px;color:#ff3356;font-size:12px;font-weight:900}.led{width:9px;height:9px;border-radius:50%;background:#ff1744;box-shadow:0 0 14px #ff1744}.navcount{margin-left:auto;padding:10px 14px;border:1px solid #282a32;background:#111217;border-radius:22px;color:#aaa}.navcount b{color:#ff2b4f}
.hero{margin:22px 0 28px;border:1px solid #2a2930;border-radius:28px;overflow:hidden;padding:34px;min-height:270px;background:radial-gradient(circle at 88% 18%,#571429 0,#211018 25%,#0d0f15 70%);position:relative}
.hero:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;right:-90px;bottom:-150px;background:#ff1744;filter:blur(100px);opacity:.18}
.eyebrow{color:#ff4564;font-size:12px;font-weight:900;letter-spacing:2px}.hero h1{font-size:clamp(34px,6vw,68px);line-height:.98;letter-spacing:-3px;margin:12px 0}.hero p{max-width:650px;color:#a2a5af;margin:0;font-size:15px}.searchbox{margin-top:24px;max-width:680px;position:relative}.searchbox input{width:100%;padding:16px 18px 16px 46px;border-radius:16px;border:1px solid #30313a;background:#08090dcc;color:#fff;outline:0}.searchbox input:focus{border-color:#ff3153}.searchicon{position:absolute;left:17px;top:15px;color:#777}
.toolbar{display:flex;gap:9px;overflow:auto;padding:2px 0 5px}.filter{white-space:nowrap;border:1px solid #292b34;background:#0d0f14;color:#aaa;padding:9px 13px;border-radius:20px;cursor:pointer}.filter.active{color:#fff;background:#211018;border-color:#ff284d}
.section{margin-top:30px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.section h2{margin:0;font-size:22px}.see{color:#777;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}
.card{background:linear-gradient(180deg,#0f1016,#0b0c11);border:1px solid #242631;border-radius:20px;overflow:hidden;cursor:pointer;transition:transform .18s,border .18s}.card:hover{transform:translateY(-4px);border-color:#ff2148}
.cover{height:155px;position:relative;background:#08090d;display:grid;place-items:center}.cover img{width:100%;height:100%;object-fit:contain;padding:22px}.livebadge{position:absolute;top:11px;left:11px;background:#ff123b;color:#fff;padding:6px 9px;border-radius:8px;font-size:10px;font-weight:900;box-shadow:0 0 18px #ff174455}.fav{position:absolute;right:10px;top:10px;width:35px;height:35px;border-radius:50%;border:1px solid #30313a;background:#08090ddd;color:#aaa;cursor:pointer;font-size:18px}.fav.on{color:#ff3154}
.info{padding:14px}.title{font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:#858894;font-size:12px;margin-top:6px;display:flex;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.quality{margin-left:auto;color:#aaa}
.empty{padding:40px;text-align:center;border:1px dashed #2a2c35;border-radius:20px;color:#777}
.overlay{position:fixed;inset:0;background:#000c;display:none;align-items:flex-end;justify-content:center;z-index:30;padding:10px}.overlay.open{display:flex}.modal{width:min(950px,100%);max-height:95vh;overflow:auto;background:#0b0c11;border:1px solid #292b34;border-radius:25px;padding:12px}.close{float:right;width:40px;height:40px;border-radius:50%;border:0;background:#202129;color:#fff;font-size:22px;cursor:pointer;position:relative;z-index:2}.video{clear:both;margin-top:4px;background:#000;border-radius:18px;overflow:hidden;aspect-ratio:16/9}.video video{width:100%;height:100%;display:block}.detail{padding:17px 5px}.detail h2{margin:0 0 10px;font-size:25px}.tags span{display:inline-block;background:#191a21;border:1px solid #272932;color:#aeb0ba;border-radius:9px;padding:7px 10px;font-size:11px;margin:0 6px 6px 0}.status{color:#8e919c;font-size:12px;margin-top:8px}.report{margin-top:15px;width:100%;border:1px solid #4a1523;background:#210b13;color:#ff4564;padding:13px;border-radius:12px}
@media(max-width:950px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:650px){.shell{padding:10px 11px 45px}.nav{top:5px}.brand{display:none}.navcount{font-size:12px}.hero{padding:24px;min-height:250px}.grid{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:5px}.card{flex:0 0 225px;scroll-snap-align:start}.cover{height:145px}.section h2{font-size:20px}}
</style>
</head>
<body>
<div class="shell">
<header class="nav"><img class="logo" src="https://dummyimage.com/100x100/171820/fff&text=TV"><div class="brand">HASU TV<small>LIVE IPTV</small></div><div class="navlive"><i class="led"></i> LIVE</div><div class="navcount">📺 <b id="total">0</b> Channels</div></header>
<section class="hero">
<div class="eyebrow">WATCH LIVE • FAST • SIMPLE</div><h1>Your TV.<br>Everywhere.</h1><p>Browse live channels by category, search instantly and open a lightweight HLS player built for mobile and TV browsers.</p>
<div class="searchbox"><span class="searchicon">⌕</span><input id="search" placeholder="Search channel, country or category..."></div>
</section>
<div class="toolbar" id="filters"></div>
<main id="content"></main>
</div>

<div class="overlay" id="overlay"><div class="modal"><button class="close" id="close">×</button><div class="video"><video id="video" controls playsinline></video></div><div class="detail"><h2 id="channelTitle"></h2><div class="tags" id="tags"></div><div class="status" id="status"></div><button class="report" id="report">⚑ Report playback issue</button></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
let CHANNELS=[],currentFilter="All",hls=null;const $=x=>document.getElementById(x);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function init(){try{const r=await fetch("./channels.json",{cache:"no-store"});if(!r.ok)throw 0;CHANNELS=await r.json()}catch(e){$("content").innerHTML='<div class="empty">channels.json could not be loaded.</div>';return} $("total").textContent=CHANNELS.length;buildFilters();render()}
function buildFilters(){const cats=["All",...new Set(CHANNELS.map(c=>c.category).filter(Boolean))];$("filters").innerHTML=cats.map(c=>`<button class="filter ${c===currentFilter?"active":""}" data-filter="${esc(c)}">${esc(c)}</button>`).join("");document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{currentFilter=b.dataset.filter;buildFilters();render()})}
function filtered(){const q=$("search").value.toLowerCase().trim();return CHANNELS.filter(c=>(currentFilter==="All"||c.category===currentFilter)&&[c.name,c.country,c.language,c.category,c.quality].join(" ").toLowerCase().includes(q))}
function icon(c){return c.category==="Sports"?"🏆":c.category==="News"?"📰":c.category==="Entertainment"?"🍿":c.category==="Religious"?"🕌":"📺"}
function render(){const list=filtered(),groups={};list.forEach(c=>(groups[c.category]??=[]).push(c));$("content").innerHTML="";if(!list.length){$("content").innerHTML='<div class="empty">No channels found.</div>';return}
Object.entries(groups).forEach(([cat,items])=>{const s=document.createElement("section");s.className="section";s.innerHTML=`<div class="sectionhead"><h2>${icon(items[0])} ${esc(cat)}</h2><span class="see">${items.length} channels</span></div><div class="grid"></div>`;const grid=s.querySelector(".grid");items.forEach(c=>{const a=document.createElement("article");a.className="card";a.innerHTML=`<div class="cover"><span class="livebadge">LIVE</span><button class="fav">☆</button><img src="${esc(c.logo)}" onerror="this.src='https://dummyimage.com/600x360/14151d/fff&text=TV'"></div><div class="info"><div class="title">${esc(c.name)}</div><div class="meta"><span>${esc(c.country||"Global")} · ${esc(c.category||"Live")}</span><span class="quality">${esc(c.quality||"HD")}</span></div></div>`;a.querySelector(".fav").onclick=e=>{e.stopPropagation();e.currentTarget.classList.toggle("on");e.currentTarget.textContent=e.currentTarget.classList.contains("on")?"★":"☆"};a.onclick=()=>open(c);grid.appendChild(a)});$("content").appendChild(s)})}
function open(c){$("overlay").classList.add("open");$("channelTitle").textContent=c.name;$("tags").innerHTML=[c.country,c.language,c.category,c.quality].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("");$("status").textContent="Preparing playback...";play(c.stream)}
function play(url){if(hls){hls.destroy();hls=null}$("video").pause();$("video").removeAttribute("src");$("video").load();if(!url){$("status").textContent="No stream URL added for this channel.";return}
if($("video").canPlayType("application/vnd.apple.mpegurl")){$("video").src=url;$("status").textContent="Direct HLS playback";$("video").play().catch(()=>{});return}
if(window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true,lowLatencyMode:true,maxBufferLength:10});hls.loadSource(url);hls.attachMedia($("video"));hls.on(Hls.Events.MANIFEST_PARSED,()=>{$("status").textContent="Direct HLS playback";$("video").play().catch(()=>{})});hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal){$("status").textContent="Direct playback failed — trying proxy...";tryProxy(url)}})}else $("status").textContent="HLS is not supported by this browser."}
function tryProxy(url){if(hls){hls.destroy();hls=null}const p="/api/proxy?url="+encodeURIComponent(url);if(window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true,lowLatencyMode:true,maxBufferLength:10});hls.loadSource(p);hls.attachMedia($("video"));hls.on(Hls.Events.MANIFEST_PARSED,()=>{$("status").textContent="Proxy playback ready";$("video").play().catch(()=>{})});hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)$("status").textContent="Proxy playback also failed."})}else{$("video").src=p;$("status").textContent="Proxy playback"}}
function close(){if(hls){hls.destroy();hls=null}$("video").pause();$("video").removeAttribute("src");$("video").load();$("overlay").classList.remove("open")}
$("close").onclick=close;$("overlay").onclick=e=>{if(e.target===$("overlay"))close()};$("search").oninput=render;init();
</script>
</body></html>
